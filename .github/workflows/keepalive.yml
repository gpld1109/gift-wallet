name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days without activity. This hits a
# tiny public RPC once a day so the project always looks active and never pauses.
#
# The URL and anon key below are PUBLIC values (the anon key ships in the web app
# and is protected by Row Level Security), so hardcoding them here changes nothing
# about security and saves setting up repo secrets.

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab

env:
  SUPABASE_URL: "https://wfsaujnxqdobqqobqvem.supabase.co"
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indmc2F1am54cWRvYnFxb2JxdmVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5OTQ3NDMsImV4cCI6MjA5NjU3MDc0M30.C23sbsI9dLq8sJLETodWCx-Z0P4h71qWPXkB2eCpxkQ"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/ping"             -H "apikey: $SUPABASE_ANON_KEY"             -H "Authorization: Bearer $SUPABASE_ANON_KEY"             -H "Content-Type: application/json"             -d '{}' -o /dev/null -w "%{http_code}")
          echo "Supabase responded: HTTP $code"
          case "$code" in 2*) exit 0 ;; *) echo "Unexpected status"; exit 1 ;; esac
